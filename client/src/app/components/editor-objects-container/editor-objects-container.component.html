<div class="main-object-container">
    <span class="title">Objets</span>
    <div class="object-grid-container">
        <div class="objects">
            @for (item of gameObjects; track item.id;) {
            <app-game-object
                [id]="item.id"
                [imageUrl]="item.image"
                [name]="item.name"
                [description]="item.description"
                [count]="item.count"
                draggable="true"
                (dragstart)="onDragStart($event, item)"
            ></app-game-object>
            }
        </div>
    </div>
</div>
