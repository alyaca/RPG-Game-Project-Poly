<div [ngClass]="['player', isAdmin() ? 'admin' : '']">
    <div class="motif"></div>
    <div class="player-name">
        <div class="kick"></div>
        {{ lobbyPlayer.name }}
        <div class="status"></div>
    </div>   
    <img class="player-img" [src]="lobbyPlayer.avatar" alt="{{ lobbyPlayer.name }}-avatar" />
    <div class="motif"></div>
</div>
