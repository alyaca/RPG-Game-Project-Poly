<div [ngClass]="['player', lobbyPlayer.isAdmin ? 'admin' : '']">
    <div class="motif"></div>
    <div class="player-name">{{ lobbyPlayer.name }}</div>   
    <img [src]="lobbyPlayer.avatar" alt="{{ lobbyPlayer.name }}-avatar" />
    <div class="attributes-box">
        <div class="attribute">attaque: {{ lobbyPlayer.attributes.attack }}</div>
        <div class="attribute">défense: {{ lobbyPlayer.attributes.defense }}</div>
        <div class="attribute">vie: {{ lobbyPlayer.attributes.health }}</div>
        <div class="attribute">rapidité: {{ lobbyPlayer.attributes.speed }}</div>
    </div>
</div>
