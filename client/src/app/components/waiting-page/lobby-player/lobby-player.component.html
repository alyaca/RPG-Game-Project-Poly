<div [ngClass]="['player', sizeClass, isAdmin ? 'admin' : '']">
    <!-- <div class="player"> -->
    <div class="player-name">{{ name }}</div>
    <img [src]="imageSrc" alt="{{ name }}-avatar" />
    <div class="attributes-box">
        <div class="attribute">attaque: {{ attack }}</div>
        <div class="attribute">défense: {{ defense }}</div>
        <div class="attribute">vie: {{ health }}</div>
        <div class="attribute">rapidité: {{ speed }}</div>
    </div>
</div>
