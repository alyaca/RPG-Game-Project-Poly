<div [ngClass]="['player', isAdmin() ? 'admin' : '']">
    <div class="motif"></div>
    <div class="player-name">
        @if(isPlayerAdmin) {
        <div class="kick" (click)="kickOutPlayer()">
            <img src="./assets/images/icones/kick.png" />
        </div>
        }
        {{ lobbyPlayer.name }}
        <div class="status"></div>
    </div>
    <img class="player-img" [src]="lobbyPlayer.avatar?.src" alt="{{ lobbyPlayer.name }}-avatar" />
    <div class="motif"></div>
</div>
