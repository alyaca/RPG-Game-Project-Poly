<div id="map-grid" [style.grid-template-columns]="'repeat(' + height + ', 1fr)'" (mouseleave)="onMouseUp()">
    @for (row of tilesGrid; let rowIndex = $index; track $index) { 
      @for (col of row; let colIndex = $index; track $index) {
        <div
            class="tile"
            [id]="'tile-' + rowIndex + '-' + colIndex"
            (mousedown)="onMouseDown($event, rowIndex, colIndex)"
            (mouseup)="onMouseUp()"
            (mousemove)="onMouseMove(rowIndex, colIndex)"
            (contextmenu)="tileService.removeTile($event, rowIndex, colIndex, this.tilesGrid)"
        >
          <img [src]="tileService.getTileImage(col)" draggable="false" />
        </div>
      } 
    }
</div>
