<div class="player-info" [ngClass]="{ 'right-player': isOnRightSide }">
    <div class="player-attributes">
        <p class="player-name" [ngClass]="{ damaged: isDamaged }">{{ player.name }}</p>
        <div class="hp-bar-container">
            <progress
                class="hp-bar"
                value="{{ player.attributes.currentHp }}"
                max="{{ player.attributes.totalHp }}"
                [ngClass]="{ damaged: isDamaged }"
                #hpBar
            ></progress>
            <div class="individual-stat hp-value" [ngClass]="{ damaged: isDamaged }">
                {{ player.attributes.currentHp }} / {{ player.attributes.totalHp }}
            </div>
        </div>
        <div class="stats">
            <div class="individual-stat speed">Rap : {{ player.attributes.speed }}</div>
            <div class="individual-stat attack">Att : {{ player.attributes.attack }}</div>
            <div class="individual-stat defense">Def : {{ player.attributes.defense }}</div>
        </div>
    </div>
</div>
