<div class="tools-container">
    <div class="tool">
        <mat-button-toggle value="waterTile" name="uniqueTool" id="water-tool"> Tuile d'eau</mat-button-toggle>
        <label for="water-tool" id="water-tool-description" class="hidden-description-to-show">
            <img src="assets/images/WaterTile-test.jpg" />
            Outil servant à placer une tuile d'eau ayant un côut de mouvement de deux. Placer la tuile avec un clic gauche sur une tuile existante.
        </label>
    </div>
    <div class="tool">
        <mat-button-toggle value="iceTile" name="uniqueTool" id="ice-tool">Tuile de glace</mat-button-toggle>
        <label for="ice-tool" id="ice-tool-description" class="hidden-description-to-show">
            <img src="assets/images/IceTile-test.jpg" /> Outil servant à placer une tuile de glace ayant un coût de mouvement de zéro. Placer la tuile
            avec un clic gauche sur une tuile existante.
        </label>
    </div>

    <div class="tool">
        <mat-button-toggle value="wallTile" name="uniqueTool" id="wall-tool"> Tuile de mur </mat-button-toggle>
        <label for="wall-tool" class="hidden-description-to-show" id="wall-tool-description">
            <img src="assets/images/WallTile-Test.jpg" /> Outil servant à placer une tuile de mur empêchant le mouvement à travers ce type de tuile.
            Placer la tuile avec un clic gauche sur une tuile existante.
        </label>
    </div>

    <div class="tool">
        <mat-button-toggle value="doorTile" name="uniqueTool" id="door-tool"> Tuile de porte </mat-button-toggle>
        <label for="door-tool" class="hidden-description-to-show" id="door-tool-description">
            <img src="assets/images/DoorTile-test.jpg" /> Outil servant à placer une porte pouvant être ouverte ou fermée. Placer la tuile avec un
            clic gauche sur une tuile existante. Si vous appuyez sur une porte déjà existante, son état s'inversera.
        </label>
    </div>
</div>
