<app-tool-button id="water-tool" [buttonName]="names[0]"> </app-tool-button>
<label for="water-tool" id="water-tool-description" class="hidden-description-to-show">
    <img src="assets/images/WaterTile-test.jpg" />
    Outil servant à placer une tuile d'eau ayant un côut de mouvement de deux. Placer la tuile avec un clic gauche sur une tuile existante.
</label>

<app-tool-button id="ice-tool" [buttonName]="names[1]"></app-tool-button>
<label for="ice-tool" id="ice-tool-description" class="hidden-description-to-show">
    <img src="assets/images/IceTile-test.jpg" /> Outil servant à placer une tuile de glace ayant un coût de mouvement de zéro. Placer la tuile avec un
    clic gauche sur une tuile existante.
</label>

<app-tool-button id="wall-tool" [buttonName]="names[2]"></app-tool-button>
<label for="wall-tool" class="hidden-description-to-show" id="wall-tool-description">
    <img src="assets/images/WallTile-Test.jpg" /> Outil servant à placer une tuile de mur empêchant le mouvement à travers ce type de tuile. Placer la
    tuile avec un clic gauche sur une tuile existante.
</label>

<app-tool-button id="door-tool" [buttonName]="names[3]"></app-tool-button>
<label for="door-tool" class="hidden-description-to-show" id="door-tool-description">
    <img src="assets/images/DoorTile-test.jpg" /> Outil servant à placer une porte pouvant être ouverte ou fermée. Placer la tuile avec un clic gauche
    sur une tuile existante. Si vous appuyez sur une porte déjà existante, son état s'inversera.
</label>
