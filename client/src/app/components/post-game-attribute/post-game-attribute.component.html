@if(isAttrRecord()){
    <div 
    class="attribute" 
    (mouseenter)="postGameService.updateExplanations('victories')"
    (mouseleave)="postGameService.updateExplanations('')">
        <div class="sort-buttons">
            <div class="sort-button" (click)="postGameService.sortPlayers('victories')"                         [ngClass]="{
                'ascending': postGameService.sortOrder['victories'] === sortOrder.Ascending,
                'descending': postGameService.sortOrder['victories'] === sortOrder.Descending,
                'unsorted': postGameService.sortOrder['victories'] === sortOrder.Unsorted
            }"></div>
            <div class="sort-button" (click)="postGameService.sortPlayers('evasions')"                        [ngClass]="{
                'ascending': postGameService.sortOrder['evasions'] === sortOrder.Ascending,
                'descending': postGameService.sortOrder['evasions'] === sortOrder.Descending,
                'unsorted': postGameService.sortOrder['evasions'] === sortOrder.Unsorted
            }"></div>
            <div class="sort-button" (click)="postGameService.sortPlayers('defeats')"                        [ngClass]="{
                'ascending': postGameService.sortOrder['defeats'] === sortOrder.Ascending,
                'descending': postGameService.sortOrder['defeats'] === sortOrder.Descending,
                'unsorted': postGameService.sortOrder['defeats'] === sortOrder.Unsorted
            }"></div>
        </div>
        <p class="attr-txt">W/D/L</p>
    </div>
}
@else {
    <div 
        class="attribute" 
        (mouseenter)="postGameService.updateExplanations(attribute)"
        (mouseleave)="postGameService.updateExplanations('')"
        (click)="postGameService.sortPlayers(attribute)" >
    <div 
        class="sort-button" 
        [ngClass]="{
            'ascending': postGameService.sortOrder[attribute] === sortOrder.Ascending,
            'descending': postGameService.sortOrder[attribute] === sortOrder.Descending,
            'unsorted': postGameService.sortOrder[attribute] === sortOrder.Unsorted
        }"
    ></div>
    <p class="attr-txt"> {{ displayTxt }}</p>
</div>
}
