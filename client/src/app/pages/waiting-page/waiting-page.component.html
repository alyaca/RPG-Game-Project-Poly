<div id="waiting-page">
    <header>
        @if(chosenGame){
        <h3>Nom de la partie: {{ chosenGame.name }}</h3>
        }
        <h3>Code d'accès: {{ accessCode }}</h3>
    </header>
    <main>
        <div id="players-container">
            @for (player of players; track player.id) {
                <app-lobby-player
                    class = "medium"
                    [lobbyPlayer]="players[$index]"
                ></app-lobby-player>
            }
        </div>
    </main>
    <footer>
        <div id="footer-container">
            <app-chat-box></app-chat-box>
            <div id="start-container">
                <button id="start" (click)="handleStartGame()">Lancer une partie</button>
                <button id="quit-button" (click)="handleExit()">Quitter</button>
            </div>
            <div id="lock-container">
                <p class="lock-text">Verrouiller la partie</p>
                <label class="switch">
                    <input type="checkbox" [(ngModel)]="isLocked" (change)="onLockChange()" />
                    <span class="slider"> </span>
                </label>
            </div>
        </div>
    </footer>
</div>
