<div class="page-element disabled" #pageElement>
    @if (isInCombat){
    <app-combat-modal [isInCombat]="isInCombat" (closeModalEvent)="closeCombatModal()"></app-combat-modal>
    }
    <div class="left-container">
        <div class="player-bar">
            <app-player-info-inventory class="player-bar" [playerId]="socketCommunicationService.socket.id"></app-player-info-inventory>
        </div>
        <div class="chat">
            <app-chat-box [isToggleable]="true"></app-chat-box>
        </div> 
        <div class="quit" (click)="handleExit()">
            <p>Abandonner la partie</p>
        </div>
    </div>
    <div class="middle-container">
        <div class="game-info">
            <p id="grid-size">{{ mapDimensions }}</p>
            <p id="map-name">{{ mapName }}</p>
            <p id="player-count">{{ getPlayerCount() }} joueurs</p>
        </div>
        @if (isTurnStartShowed) {
        <div id="turn-start-timer">
            <p>Votre tour commence dans</p>
            <app-timer
                [isShowed]="isTurnStartShowed"
                [totalTime]="1"
                [timeRemaining]="1"
                [timerSize]="45"
                (closeTimer)="closeTurnStartPopUp()"
            ></app-timer>
        </div>
        }
        <div id="game-grid-background-gradient">
            <div class="grid-element" id="game-grid-container" #gameGrid>
                <app-game-grid></app-game-grid>
            </div>
        </div>
    </div>
    <div class="right-container">
        <div class="timer">
            <app-timer [totalTime]="60" [timeRemaining]="60" [timerSize]="45" #turnTimer> </app-timer>
        </div>
        <div class="players">
            @for (player of allPlayers; track player.id ;){
            <app-ingame-players-sidebar [sidebarPlayer]="player"> </app-ingame-players-sidebar>
            }
        </div>
        <div>
            <div class="action-container">
                <div class="center-button">
                    <p class="action-text">Porte</p>
                    <div class="button-outer action-outer" [class.selected]="isActionSelected" (click)="toggleActionSelected()">
                        <div class="action-button door-button"></div>
                    </div>
                </div>

                <div class="center-button">
                    <p class="action-text">Attaquer</p>
                    <div class="button-outer action-outer" [class.selected]="isActionSelected" (click)="toggleActionSelected()">
                        <div class="action-button attack-button" (click)="openCombatModal()"></div>
                    </div>
                </div>
                <div class="center-button">
                    <p class="action-text">Fin de tour</p>
                    <div class="button-outer end-outer">
                        <div class="end-turn-button-inner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
