<body class="background-image">
    <div class="create-game-page">
        <div class="title">Administration</div>
        <hr class="line-separator" />
        <app-game-list [usingPage]="'administration-page'"></app-game-list>
        <div class="button-group">
            <p class="button" routerLink="/">Retour</p>
            <p class="button" (click)="importGame()">Importer un jeu</p>
            <p class="button" (click)="openPopUp()">Créer un nouveau jeu</p>
            <input type="file" #fileInput accept=".json" style="display: none" (change)="handleFileInput($event)" />
        </div>
    </div>
</body>
